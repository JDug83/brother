<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>GazBrowse</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #0b0b0b;
    color: white;

    font-family: Arial, sans-serif;
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =========================
   DESKTOP TOP BAR
========================= */

.desktop-bar {
    height: 58px;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 8px 12px;

    background: #111;
    border-bottom: 1px solid #292929;
}


/* =========================
   LOGO
========================= */

.logo {
    font-weight: bold;
    font-size: 18px;

    padding: 0 10px;

    white-space: nowrap;
}


/* =========================
   NAV BUTTONS
========================= */

.nav-button {
    width: 38px;
    height: 38px;

    border: none;
    border-radius: 50%;

    background: #222;
    color: white;

    font-size: 18px;

    cursor: pointer;
}

.nav-button:hover {
    background: #333;
}


/* =========================
   ADDRESS BAR
========================= */

.address {
    flex: 1;

    height: 40px;

    border-radius: 20px;

    border: none;
    outline: none;

    background: #222;
    color: white;

    padding: 0 18px;

    font-size: 15px;
}

.address::placeholder {
    color: #888;
}


/* =========================
   CONTENT
========================= */

.content {
    flex: 1;

    position: relative;

    overflow: hidden;
}


/* =========================
   HOME PAGE
========================= */

.home {
    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;
}

.home h1 {
    margin: 0;

    font-size: clamp(35px, 7vw, 65px);
}

.search {
    width: min(650px, 90vw);

    height: 58px;

    border: none;
    outline: none;

    border-radius: 30px;

    padding: 0 25px;

    font-size: 17px;
}


/* =========================
   MOBILE BOTTOM BAR
========================= */

.mobile-bar {
    display: none;

    height: 68px;

    background: #111;

    border-top: 1px solid #292929;

    align-items: center;

    padding: 8px 10px;

    gap: 8px;
}


/* =========================
   TAB BUTTON
========================= */

.tab-button {
    flex: 1;

    height: 48px;

    border: none;

    border-radius: 14px;

    background: #222;
    color: white;

    cursor: pointer;

    font-size: 14px;
}

.tab-button.active {
    background: #444;
}


/* =========================
   NEW TAB
========================= */

.new-tab {
    width: 50px;
    height: 48px;

    border: none;

    border-radius: 14px;

    background: white;
    color: black;

    font-size: 25px;

    cursor: pointer;
}


/* =========================
   TAB MENU
========================= */

.tab-menu {
    display: none;

    position: absolute;

    left: 10px;
    right: 10px;

    bottom: 78px;

    max-height: 60vh;

    overflow-y: auto;

    background: #181818;

    border: 1px solid #333;

    border-radius: 18px;

    padding: 10px;

    z-index: 100;
}

.tab-menu.open {
    display: block;
}


.tab-row {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px;

    border-radius: 12px;

    background: #222;

    margin-bottom: 8px;
}

.tab-row.active {
    background: #333;
}

.tab-name {
    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.close-tab {
    width: 32px;
    height: 32px;

    border: none;

    border-radius: 50%;

    background: #444;
    color: white;

    cursor: pointer;
}


/* =========================
   DESKTOP TABS
========================= */

.desktop-tabs {
    height: 42px;

    display: flex;

    align-items: center;

    gap: 5px;

    padding: 5px 8px;

    background: #0f0f0f;

    overflow-x: auto;
}

.desktop-tab {
    min-width: 150px;
    max-width: 220px;

    height: 34px;

    padding: 0 10px;

    border: none;

    border-radius: 8px;

    background: #222;

    color: white;

    cursor: pointer;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.desktop-tab.active {
    background: #333;
}

.desktop-new-tab {
    width: 34px;
    height: 34px;

    border: none;

    border-radius: 8px;

    background: #222;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .desktop-bar {
        height: 55px;

        padding: 7px;
    }

    .logo {
        display: none;
    }

    .nav-button {
        width: 36px;
        height: 36px;
    }

    .address {
        height: 40px;
        font-size: 14px;
    }

    .desktop-tabs {
        display: none;
    }

    .mobile-bar {
        display: flex;
    }

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 701px) {

    .desktop-tabs {
        display: flex;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 400px) {

    .mobile-bar {
        gap: 5px;
        padding: 7px;
    }

    .tab-button {
        font-size: 12px;
    }

    .new-tab {
        width: 46px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- =========================
         DESKTOP / MOBILE TOOLBAR
    ========================== -->

    <div class="desktop-bar">

        <div class="logo">
            GazBrowse
        </div>

        <button
            class="nav-button"
            onclick="goBack()">
            ‹
        </button>

        <button
            class="nav-button"
            onclick="goForward()">
            ›
        </button>

        <button
            class="nav-button"
            onclick="reloadPage()">
            ↻
        </button>

        <input
            id="address"
            class="address"
            type="text"
            placeholder="Search Google or enter a URL"
            autocomplete="off"
        >

    </div>


    <!-- =========================
         DESKTOP TABS
    ========================== -->

    <div
        class="desktop-tabs"
        id="desktopTabs">
    </div>


    <!-- =========================
         CONTENT
    ========================== -->

    <div class="content">

        <div
            class="home"
            id="home">

            <h1>
                GazBrowse
            </h1>

            <input
                id="search"
                class="search"
                placeholder="Search Google..."
                autocomplete="off"
            >

        </div>


        <!-- MOBILE TAB MENU -->

        <div
            class="tab-menu"
            id="tabMenu">
        </div>

    </div>


    <!-- =========================
         MOBILE BOTTOM BAR
    ========================== -->

    <div class="mobile-bar">

        <button
            class="tab-button"
            id="tabButton"
            onclick="toggleTabs()">

            Tabs
        </button>

        <button
            class="new-tab"
            onclick="newTab()">

            +
        </button>

    </div>

</div>


<script>

/* =================================
   TAB SYSTEM
================================= */

let tabs = [
    {
        title: "New Tab",
        url: "",
        history: [],
        historyIndex: -1
    }
];

let activeTab = 0;


/* =================================
   ELEMENTS
================================= */

const address =
    document.getElementById("address");

const search =
    document.getElementById("search");

const home =
    document.getElementById("home");

const desktopTabs =
    document.getElementById("desktopTabs");

const tabMenu =
    document.getElementById("tabMenu");

const tabButton =
    document.getElementById("tabButton");


/* =================================
   GOOGLE SEARCH
================================= */

function searchGoogle(query) {

    query = query.trim();

    if (!query) {
        return;
    }

    tabs[activeTab].title = query;
    tabs[activeTab].url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

    tabs[activeTab].history.push(
        tabs[activeTab].url
    );

    tabs[activeTab].historyIndex =
        tabs[activeTab].history.length - 1;

    address.value =
        tabs[activeTab].url;

    renderTabs();

    /*
       Google does not allow its
       search page to be displayed
       inside an iframe.

       Therefore we navigate the
       current browser tab to Google.
    */

    window.location.href =
        tabs[activeTab].url;
}


/* =================================
   SEARCH FORM
================================= */

search.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchGoogle(
                search.value
            );

        }

    }
);


/* =================================
   ADDRESS BAR
================================= */

address.addEventListener(
    "keydown",
    function(event) {

        if (event.key !== "Enter") {
            return;
        }

        let value =
            address.value.trim();

        if (!value) {
            return;
        }


        /*
           If it looks like a URL,
           open it directly.
        */

        if (
            value.startsWith("http://") ||
            value.startsWith("https://")
        ) {

            tabs[activeTab].url =
                value;

            tabs[activeTab].title =
                value;

            tabs[activeTab].history.push(
                value
            );

            tabs[activeTab].historyIndex =
                tabs[activeTab].history.length - 1;

            renderTabs();

            window.location.href =
                value;

            return;
        }


        /*
           Otherwise search Google.
        */

        searchGoogle(value);

    }
);


/* =================================
   NEW TAB
================================= */

function newTab() {

    tabs.push({
        title: "New Tab",
        url: "",
        history: [],
        historyIndex: -1
    });

    activeTab =
        tabs.length - 1;

    address.value = "";

    search.value = "";

    renderTabs();

    closeTabMenu();

}


/* =================================
   CLOSE TAB
================================= */

function closeTab(index) {

    if (tabs.length === 1) {

        tabs[0] = {
            title: "New Tab",
            url: "",
            history: [],
            historyIndex: -1
        };

        activeTab = 0;

    } else {

        tabs.splice(index, 1);

        if (activeTab >= tabs.length) {
            activeTab =
                tabs.length - 1;
        }

    }

    loadTab();

    renderTabs();

}


/* =================================
   SWITCH TAB
================================= */

function switchTab(index) {

    activeTab = index;

    loadTab();

    closeTabMenu();

    renderTabs();

}


/* =================================
   LOAD TAB
================================= */

function loadTab() {

    const tab =
        tabs[activeTab];

    address.value =
        tab.url;

    if (!tab.url) {

        home.style.display =
            "flex";

        search.value = "";

        return;
    }

    /*
       The page has already navigated
       away from GazBrowse if it is
       Google.

       This function mainly prepares
       the tab state.
    */

}


/* =================================
   DESKTOP TABS
================================= */

function renderTabs() {

    desktopTabs.innerHTML = "";

    tabs.forEach(
        function(tab, index) {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "desktop-tab";

            if (
                index === activeTab
            ) {

                button.classList.add(
                    "active"
                );

            }

            button.textContent =
                tab.title;

            button.onclick =
                function() {

                    switchTab(index);

                };

            desktopTabs.appendChild(
                button
            );

        }
    );


    const plus =
        document.createElement(
            "button"
        );

    plus.className =
        "desktop-new-tab";

    plus.textContent = "+";

    plus.onclick = newTab;

    desktopTabs.appendChild(
        plus
    );


    tabButton.textContent =
        "Tabs " + tabs.length;

}


/* =================================
   MOBILE TAB MENU
================================= */

function toggleTabs() {

    tabMenu.classList.toggle(
        "open"
    );

    renderMobileTabs();

}


function closeTabMenu() {

    tabMenu.classList.remove(
        "open"
    );

}


/* =================================
   RENDER MOBILE TABS
================================= */

function renderMobileTabs() {

    tabMenu.innerHTML = "";

    tabs.forEach(
        function(tab, index) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "tab-row";

            if (
                index === activeTab
            ) {

                row.classList.add(
                    "active"
                );

            }


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "tab-name";

            name.textContent =
                tab.title;


            const close =
                document.createElement(
                    "button"
                );

            close.className =
                "close-tab";

            close.textContent = "×";

            close.onclick =
                function(event) {

                    event.stopPropagation();

                    closeTab(index);

                };


            row.appendChild(name);
            row.appendChild(close);


            row.onclick =
                function() {

                    switchTab(index);

                };


            tabMenu.appendChild(row);

        }
    );

}


/* =================================
   BACK
================================= */

function goBack() {

    if (
        tabs[activeTab].historyIndex > 0
    ) {

        tabs[activeTab].historyIndex--;

        const url =
            tabs[activeTab].history[
                tabs[activeTab].historyIndex
            ];

        window.location.href =
            url;

    } else {

        window.history.back();

    }

}


/* =================================
   FORWARD
================================= */

function goForward() {

    const tab =
        tabs[activeTab];

    if (
        tab.historyIndex <
        tab.history.length - 1
    ) {

        tab.historyIndex++;

        window.location.href =
            tab.history[
                tab.historyIndex
            ];

    } else {

        window.history.forward();

    }

}


/* =================================
   RELOAD
================================= */

function reloadPage() {

    location.reload();

}


/* =================================
   INITIALISE
================================= */

renderTabs();

</script>

</body>
</html>
