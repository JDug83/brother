<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GazBrowse</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 58px;
    min-height: 58px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px 10px;

    background: #111;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 17px;
    font-weight: bold;
    padding: 0 8px;
}

.control {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 50%;

    background: #242424;
    color: white;

    font-size: 19px;
    cursor: pointer;
}

.control:active {
    transform: scale(.94);
}

.address {
    flex: 1;

    height: 40px;

    border: 0;
    outline: 0;
    border-radius: 22px;

    background: #242424;
    color: white;

    padding: 0 16px;

    font-size: 14px;
}

/* =========================
   PAGE
========================= */

.browser {
    flex: 1;
    min-height: 0;

    position: relative;

    background: white;
}

.home {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 20px;

    background: #080808;
    z-index: 2;
}

.home h1 {
    margin: 0;
    font-size: clamp(38px, 8vw, 64px);
}

.search {
    width: min(650px, 90vw);
    height: 56px;

    border: 0;
    outline: 0;

    border-radius: 30px;

    padding: 0 22px;

    font-size: 16px;
}

/* =========================
   IFRAME
========================= */

.browser-frame {
    width: 100%;
    height: 100%;

    border: 0;

    display: none;

    background: white;
}

.browser-frame.show {
    display: block;
}

/* =========================
   MOBILE TAB BAR
========================= */

.bottom {
    display: none;

    height: 70px;
    min-height: 70px;

    background: #111;

    border-top: 1px solid #292929;

    padding: 8px;

    gap: 8px;

    align-items: center;
}

.tabs-button {
    flex: 1;

    height: 50px;

    border: 0;
    border-radius: 15px;

    background: #242424;
    color: white;

    font-size: 14px;
}

.new-tab {
    width: 52px;
    height: 50px;

    border: 0;
    border-radius: 15px;

    background: white;
    color: black;

    font-size: 25px;
}

/* =========================
   TAB MENU
========================= */

.tab-menu {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 78px;

    max-height: 65vh;

    overflow-y: auto;

    padding: 10px;

    background: #181818;

    border: 1px solid #333;
    border-radius: 18px;

    z-index: 20;

    display: none;
}

.tab-menu.open {
    display: block;
}

.tab {
    display: flex;
    align-items: center;

    gap: 10px;

    padding: 13px;

    margin-bottom: 8px;

    border-radius: 12px;

    background: #242424;
}

.tab.active {
    background: #383838;
}

.tab-name {
    flex: 1;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.close {
    width: 32px;
    height: 32px;

    border: 0;
    border-radius: 50%;

    background: #444;
    color: white;

    font-size: 17px;
}

/* =========================
   DESKTOP TABS
========================= */

.desktop-tabs {
    height: 40px;
    min-height: 40px;

    display: flex;
    align-items: center;

    gap: 5px;

    padding: 4px 8px;

    background: #0e0e0e;

    overflow-x: auto;
}

.desktop-tab {
    height: 32px;

    min-width: 130px;
    max-width: 220px;

    padding: 0 14px;

    border: 0;
    border-radius: 8px;

    background: #222;
    color: white;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.desktop-tab.active {
    background: #3a3a3a;
}

.desktop-plus {
    width: 34px;
    height: 32px;

    border: 0;
    border-radius: 8px;

    background: #222;
    color: white;

    font-size: 20px;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 701px) {

    .bottom {
        display: none;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .logo {
        display: none;
    }

    .desktop-tabs {
        display: none;
    }

    .bottom {
        display: flex;
    }

    .topbar {
        height: 55px;
        min-height: 55px;

        padding: 7px;
    }

    .control {
        width: 35px;
        height: 35px;
    }

    .address {
        height: 39px;
        font-size: 13px;
    }
}
</style>

</head>

<body>

<!-- =========================
     TOP BROWSER BAR
========================= -->

<div class="topbar">

```
<div class="logo">
    GazBrowse
</div>

<button class="control" onclick="goBack()">‹</button>

<button class="control" onclick="goForward()">›</button>

<button class="control" onclick="reloadPage()">↻</button>

<input
    id="address"
    class="address"
    placeholder="Search Google or enter a URL"
    autocomplete="off"
>
```

</div>

<!-- =========================
     DESKTOP TABS
========================= -->

<div
    class="desktop-tabs"
    id="desktopTabs">
</div>

<!-- =========================
     BROWSER
========================= -->

<div class="browser">

```
<div
    class="home"
    id="home">

    <h1>GazBrowse</h1>

    <input
        id="search"
        class="search"
        placeholder="Search Google..."
        autocomplete="off"
    >

</div>


<!-- GOOGLE / WEBSITE -->

<iframe
    id="frame"
    class="browser-frame"
    title="GazBrowse browser"
    allow="fullscreen"
></iframe>


<!-- MOBILE TAB MENU -->

<div
    id="tabMenu"
    class="tab-menu">
</div>
```

</div>

<!-- =========================
     MOBILE BOTTOM BAR
========================= -->

<div class="bottom">

```
<button
    id="tabsButton"
    class="tabs-button"
    onclick="toggleTabs()">
    Tabs 1
</button>

<button
    class="new-tab"
    onclick="newTab()">
    +
</button>
```

</div>

<script>

/* =================================
   TABS
================================= */

let tabs = [
    {
        title: "New Tab",
        url: ""
    }
];

let activeTab = 0;


/* =================================
   ELEMENTS
================================= */

const frame =
    document.getElementById("frame");

const home =
    document.getElementById("home");

const search =
    document.getElementById("search");

const address =
    document.getElementById("address");

const tabMenu =
    document.getElementById("tabMenu");

const tabsButton =
    document.getElementById("tabsButton");

const desktopTabs =
    document.getElementById("desktopTabs");


/* =================================
   GOOGLE SEARCH
================================= */

function googleSearch(query) {

    query = query.trim();

    if (!query) return;

    const url =
        "https://www.google.com/search?igu=1&q=" +
        encodeURIComponent(query);

    tabs[activeTab].title = query;
    tabs[activeTab].url = url;

    address.value = url;

    home.style.display = "none";

    frame.classList.add("show");

    frame.src = url;

    renderTabs();
}


/* =================================
   SEARCH BOX
================================= */

search.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            googleSearch(search.value);
        }

    }
);


/* =================================
   ADDRESS BAR
================================= */

address.addEventListener(
    "keydown",
    function(event) {

        if (event.key !== "Enter") {
            return;
        }

        let value =
            address.value.trim();

        if (!value) return;


        /*
           Direct URL
        */

        if (
            value.startsWith("https://") ||
            value.startsWith("http://")
        ) {

            openWebsite(value);

        } else {

            googleSearch(value);

        }

    }
);


/* =================================
   OPEN WEBSITE
================================= */

function openWebsite(url) {

    tabs[activeTab].title = url;
    tabs[activeTab].url = url;

    address.value = url;

    home.style.display = "none";

    frame.classList.add("show");

    frame.src = url;

    renderTabs();
}


/* =================================
   NEW TAB
================================= */

function newTab() {

    tabs.push({
        title: "New Tab",
        url: ""
    });

    activeTab =
        tabs.length - 1;

    showCurrentTab();

    closeTabs();

    renderTabs();
}


/* =================================
   SWITCH TAB
================================= */

function switchTab(index) {

    activeTab = index;

    showCurrentTab();

    closeTabs();

    renderTabs();
}


/* =================================
   SHOW CURRENT TAB
================================= */

function showCurrentTab() {

    const tab =
        tabs[activeTab];


    if (!tab.url) {

        home.style.display = "flex";

        frame.classList.remove("show");

        frame.src = "";

        address.value = "";

        search.value = "";

        return;
    }


    home.style.display = "none";

    frame.classList.add("show");

    frame.src = tab.url;

    address.value = tab.url;
}


/* =================================
   CLOSE TAB
================================= */

function closeTab(index) {

    if (tabs.length === 1) {

        tabs[0] = {
            title: "New Tab",
            url: ""
        };

        activeTab = 0;

    } else {

        tabs.splice(index, 1);

        if (activeTab >= tabs.length) {
            activeTab = tabs.length - 1;
        }
    }

    showCurrentTab();

    renderTabs();
}


/* =================================
   MOBILE TAB MENU
================================= */

function toggleTabs() {

    renderMobileTabs();

    tabMenu.classList.toggle("open");
}


function closeTabs() {

    tabMenu.classList.remove("open");
}


function renderMobileTabs() {

    tabMenu.innerHTML = "";

    tabs.forEach(
        function(tab, index) {

            const row =
                document.createElement("div");

            row.className = "tab";

            if (index === activeTab) {
                row.classList.add("active");
            }


            const name =
                document.createElement("div");

            name.className = "tab-name";

            name.textContent =
                tab.title;


            const close =
                document.createElement("button");

            close.className = "close";

            close.textContent = "×";


            close.onclick =
                function(event) {

                    event.stopPropagation();

                    closeTab(index);
                };


            row.appendChild(name);
            row.appendChild(close);


            row.onclick =
                function() {
                    switchTab(index);
                };


            tabMenu.appendChild(row);

        }
    );
}


/* =================================
   DESKTOP TABS
================================= */

function renderTabs() {

    desktopTabs.innerHTML = "";

    tabs.forEach(
        function(tab, index) {

            const button =
                document.createElement("button");

            button.className =
                "desktop-tab";

            if (index === activeTab) {
                button.classList.add("active");
            }

            button.textContent =
                tab.title;

            button.onclick =
                function() {
                    switchTab(index);
                };

            desktopTabs.appendChild(button);
        }
    );


    const plus =
        document.createElement("button");

    plus.className = "desktop-plus";

    plus.textContent = "+";

    plus.onclick = newTab;

    desktopTabs.appendChild(plus);


    tabsButton.textContent =
        "Tabs " + tabs.length;
}


/* =================================
   BACK
================================= */

function goBack() {

    try {
        frame.contentWindow.history.back();
    } catch {
        window.history.back();
    }
}


/* =================================
   FORWARD
================================= */

function goForward() {

    try {
        frame.contentWindow.history.forward();
    } catch {
        window.history.forward();
    }
}


/* =================================
   RELOAD
================================= */

function reloadPage() {

    try {
        frame.contentWindow.location.reload();
    } catch {
        frame.src = frame.src;
    }
}


/* =================================
   START
================================= */

renderTabs();

</script>

</body>
</html>
